name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q

  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1 detect-secrets==1.5.0
      - run: python tools/check_repository_policy.py
      - run: python -m pip_audit -r requirements-video.txt --progress-spinner off

  chrome-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/chrome/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run test:contract
      - run: npm run build
      - run: npm run package
      - run: npm audit --audit-level=low
